<!doctype html>
<html lang="tr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#080a0b">
  <meta name="color-scheme" content="dark light">
  <title>Pasif Gelirim</title>
  <link rel="icon" href="icon-192.png">
  <script>
    /* Tema, sayfa çizilmeden önce uygulanır (beyaz parlama olmasın). */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('pasif_gelirim_state_v1') || '{}');
        var t = (s.settings && s.settings.theme) || 'dark';
        var d = t === 'system' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : t;
        document.documentElement.setAttribute('data-theme', d === 'light' ? 'light' : 'dark');
      } catch (e) { }
    })();
  </script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="logo.png" alt=""><p>DAHA FAZLASI MÜMKÜN.</p></div>
  <div id="app">
    <header id="top" class="top"></header>
    <main id="main" class="main"></main>
    <nav id="tabs" class="tabs" aria-label="Ana menü"></nav>
    <div id="layer"></div>
  </div>
  <noscript>Pasif Gelirim için JavaScript gerekli.</noscript>
  <script src="config.js"></script>
  <script src="data.js"></script>
  <script src="core.js"></script>
  <script src="market.js"></script>
  <script src="app.js"></script>
  <script src="main.js"></script>
</body>
</html>
